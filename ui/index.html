<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{font-family:var(--remotehand-ui-font-family,Inter,ui-sans-serif,system-ui,sans-serif);font-size:var(--remotehand-ui-font-size,13px);background:var(--remotehand-background,#11151a);color:var(--remotehand-text,#dee5ef);overflow:hidden}
[hidden]{display:none!important}
button,input,textarea{font:inherit}
button{border:1px solid var(--remotehand-border,#3d4a58);background:var(--remotehand-button-background,#232c37);color:var(--remotehand-text,#f3f7fb);border-radius:7px;padding:6px 10px;cursor:pointer}
button:hover{background:var(--remotehand-button-hover,#2a3542)}
button:disabled{opacity:.45;cursor:default}
.shell{height:100%;display:flex;flex-direction:column;min-height:0}
.toolbar{height:45px;display:flex;align-items:center;gap:6px;padding:7px 10px;border-bottom:1px solid var(--remotehand-border,#2e3743);background:var(--remotehand-surface,#171d24);flex:0 0 auto}
.toolbar .spacer{flex:1}
.tool{height:30px}
.tabs-shell{height:38px;display:grid;grid-template-columns:28px minmax(0,1fr) 28px;border-bottom:1px solid var(--remotehand-border,#2e3743);background:var(--remotehand-surface,#151b22);flex:0 0 auto}
.tab-scroll{border:0;border-radius:0;padding:0;background:transparent;color:var(--remotehand-muted-text,#9aa8b8);font-size:16px}
.tab-scroll:hover:not(:disabled){background:var(--remotehand-button-hover,#2a3542);color:var(--remotehand-text,#eef3f8)}
.tab-scroll:disabled{opacity:.28}
.tabs{height:37px;display:flex;align-items:end;gap:2px;padding:5px 4px 0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;scroll-behavior:smooth}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:6px;max-width:220px;height:32px;padding:0 8px 0 10px;border:1px solid transparent;border-bottom:0;border-radius:7px 7px 0 0;color:var(--remotehand-muted-text,#9aa8b8);white-space:nowrap;cursor:pointer}
.tab.active{background:var(--remotehand-background,#11151a);border-color:var(--remotehand-border,#2e3743);color:var(--remotehand-text,#eef3f8)}
.tab.dragging{opacity:.45}
.tab.drop-before{box-shadow:inset 2px 0 0 var(--remotehand-accent-border,#6f9bc8)}
.tab.drop-after{box-shadow:inset -2px 0 0 var(--remotehand-accent-border,#6f9bc8)}
.tab-name{min-width:0;overflow:hidden;text-overflow:ellipsis}
.dirty{font-size:16px;line-height:1}
.tab-close{border:0;background:transparent;padding:1px 4px;border-radius:4px;color:inherit}
.tab-close:hover{background:var(--remotehand-button-hover,#2a3542)}
.recovery{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--remotehand-warning-border,#765f32);background:var(--remotehand-warning-surface,#2a2418);color:var(--remotehand-text,#f4ead1);flex:0 0 auto}
.recovery strong{white-space:nowrap}
.recovery span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recovery .spacer{flex:1}
.workspace{min-height:0;flex:1;display:flex;position:relative}
.editor-wrap{min-width:0;min-height:0;flex:1;display:grid;grid-template-columns:auto minmax(0,1fr);background:var(--remotehand-terminal-background,var(--remotehand-background,#11151a))}
.gutter{min-width:48px;padding:10px 9px 40px 6px;text-align:right;white-space:pre;overflow:hidden;border-right:1px solid var(--remotehand-border,#2b3540);background:var(--remotehand-terminal-background,var(--remotehand-background,#11151a));color:var(--remotehand-muted-text,#718096);font-family:var(--remotehand-terminal-font-family,Consolas,"Cascadia Code","Courier New",monospace);font-size:var(--remotehand-terminal-font-size,13px);line-height:1.55;user-select:none}
.editor-stack{position:relative;min-width:0;min-height:0;overflow:hidden}
.syntax-layer,.editor{position:absolute;inset:0;width:100%;height:100%;margin:0;border:0;padding:10px 12px 40px;font-family:var(--remotehand-terminal-font-family,Consolas,"Cascadia Code","Courier New",monospace);font-size:var(--remotehand-terminal-font-size,13px);line-height:1.55;tab-size:4;white-space:pre;overflow:auto}
.syntax-layer{pointer-events:none;background:transparent;color:var(--remotehand-terminal-foreground,var(--remotehand-text,#e6edf3));overflow:hidden}
.syntax-layer code{font:inherit;white-space:pre}
.editor{resize:none;outline:0;background:transparent;color:transparent;-webkit-text-fill-color:transparent;caret-color:var(--remotehand-terminal-foreground,var(--remotehand-text,#fff));z-index:1}
.editor::selection{background:rgba(102,153,204,.35)}
.syn-comment{color:var(--remotehand-muted-text,#718096);font-style:italic}
.syn-string{color:var(--remotehand-success-text,var(--remotehand-text,#a8d080))}
.syn-number{color:var(--remotehand-warning-text,var(--remotehand-text,#d5a76f))}
.syn-keyword{color:var(--remotehand-accent-text,var(--remotehand-text,#7fb4e8))}
.syn-literal{color:var(--remotehand-accent-text,var(--remotehand-text,#c99be8))}
.syn-tag{color:var(--remotehand-accent-text,var(--remotehand-text,#7fb4e8))}
.syn-heading{color:var(--remotehand-accent-text,var(--remotehand-text,#7fb4e8));font-weight:600}
.syn-property{color:var(--remotehand-accent-text,var(--remotehand-text,#9ccfd8))}
.findbar{position:absolute;top:8px;right:18px;z-index:5;display:flex;gap:5px;padding:6px;border:1px solid var(--remotehand-border,#3d4a58);border-radius:8px;background:var(--remotehand-surface,#171d24);box-shadow:0 6px 24px rgba(0,0,0,.28)}
.findbar input{width:220px;border:1px solid var(--remotehand-border,#3d4a58);border-radius:6px;background:var(--remotehand-input-background,#0e141a);color:var(--remotehand-text,#eef3f8);padding:6px 8px;outline:0}
.find-count{min-width:48px;align-self:center;text-align:center;color:var(--remotehand-muted-text,#9aa8b8);font-size:12px;white-space:nowrap}
.statusbar{height:27px;display:flex;align-items:center;gap:14px;padding:0 10px;border-top:1px solid var(--remotehand-border,#2e3743);background:var(--remotehand-surface,#171d24);color:var(--remotehand-muted-text,#9aa8b8);font-size:12px;flex:0 0 auto}
.statusbar .spacer{flex:1}
.status-dirty{color:var(--remotehand-warning-text,#dfbd70)}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--remotehand-muted-text,#8290a0);pointer-events:none}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.56);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal{width:min(470px,100%);border:1px solid var(--remotehand-border,#3d4a58);border-radius:11px;background:var(--remotehand-surface,#171d24);box-shadow:0 18px 60px rgba(0,0,0,.5);padding:17px}
.modal h2{font-size:17px;margin:0 0 8px}
.modal p{margin:0;color:var(--remotehand-muted-text,#a7b2bf);line-height:1.5}
.modal-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:17px}
.primary{border-color:var(--remotehand-accent-border,#5d7fa4);background:var(--remotehand-accent-surface,#19304a)}
.danger{border-color:var(--remotehand-danger-border,#754448)}
</style>
</head>
<body>
<div class="shell">
  <div class="toolbar">
    <button id="newBtn" class="tool" type="button" title="New (Ctrl+N)">New</button>
    <button id="openBtn" class="tool" type="button" title="Open (Ctrl+O)">Open</button>
    <button id="saveBtn" class="tool" type="button" title="Save (Ctrl+S)">Save</button>
    <button id="saveAsBtn" class="tool" type="button" title="Save As (Ctrl+Shift+S)">Save As</button>
    <span class="spacer"></span>
    <button id="findBtn" class="tool" type="button" title="Find (Ctrl+F)">Find</button>
  </div>

  <div class="tabs-shell">
    <button id="tabsPrev" class="tab-scroll" type="button" title="Scroll tabs left" aria-label="Scroll tabs left">‹</button>
    <div id="tabs" class="tabs"></div>
    <button id="tabsNext" class="tab-scroll" type="button" title="Scroll tabs right" aria-label="Scroll tabs right">›</button>
  </div>

  <div id="recovery" class="recovery" hidden>
    <strong>Recovered unsaved changes</strong>
    <span>This file contains edits restored from the previous session. The file on disk has not been updated.</span>
    <span class="spacer"></span>
    <button id="recoverySave" class="primary" type="button">Save</button>
    <button id="recoveryDiscard" type="button">Discard recovered changes</button>
  </div>

  <div class="workspace">
    <div id="editorWrap" class="editor-wrap">
      <div id="gutter" class="gutter">1</div>
      <div class="editor-stack">
        <pre id="syntaxLayer" class="syntax-layer" aria-hidden="true"><code id="syntaxCode"></code></pre>
        <textarea id="editor" class="editor" autocomplete="off" autocapitalize="off" spellcheck="false" wrap="off"></textarea>
      </div>
    </div>
    <div id="empty" class="empty" hidden>No document is open.</div>
    <div id="findbar" class="findbar" hidden>
      <input id="findInput" type="text" autocomplete="off" placeholder="Find text">
      <span id="findCount" class="find-count">0 of 0</span>
      <button id="findPrev" type="button" title="Previous (Shift+Enter)">Previous</button>
      <button id="findNext" type="button" title="Next (Enter)">Next</button>
      <button id="findClose" type="button" aria-label="Close find">×</button>
    </div>
  </div>

  <div class="statusbar">
    <span id="position">Ln 1, Col 1</span>
    <span class="spacer"></span>
    <span id="saveState"></span>
    <span id="encoding">UTF-8</span>
    <span id="eol">LF</span>
    <span id="language">Plain Text</span>
  </div>
</div>

<div id="modalBackdrop" class="modal-backdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <h2 id="modalTitle"></h2>
    <p id="modalMessage"></p>
    <div id="modalActions" class="modal-actions"></div>
  </div>
</div>

<script>
(() => {
  const request = (method, params = null) => window.remotehand.request(method, params);

  const tabsHost = document.getElementById("tabs");
  const tabsPrev = document.getElementById("tabsPrev");
  const tabsNext = document.getElementById("tabsNext");
  const editor = document.getElementById("editor");
  const syntaxLayer = document.getElementById("syntaxLayer");
  const syntaxCode = document.getElementById("syntaxCode");
  const gutter = document.getElementById("gutter");
  const editorWrap = document.getElementById("editorWrap");
  const empty = document.getElementById("empty");
  const recovery = document.getElementById("recovery");
  const position = document.getElementById("position");
  const saveState = document.getElementById("saveState");
  const encoding = document.getElementById("encoding");
  const eol = document.getElementById("eol");
  const language = document.getElementById("language");
  const findbar = document.getElementById("findbar");
  const findInput = document.getElementById("findInput");
  const findCount = document.getElementById("findCount");
  const modalBackdrop = document.getElementById("modalBackdrop");
  const modalTitle = document.getElementById("modalTitle");
  const modalMessage = document.getElementById("modalMessage");
  const modalActions = document.getElementById("modalActions");

  let tabs = [];
  let activeId = null;
  let untitledCounter = 1;
  let persistTimer = null;
  let persistInFlight = Promise.resolve();
  let modalResolve = null;
  let nativeDialogPending = false;
  let draggedTabId = null;

  const basename = path => String(path || "").split(/[\\/]/).filter(Boolean).pop() || String(path || "");

  function languageInfo(name) {
    const ext = (String(name).match(/\.([^.]+)$/) || [,""])[1].toLowerCase();
    return ({
      txt:["Plain Text","text"], log:["Log","text"], md:["Markdown","markdown"],
      json:["JSON","json"], yaml:["YAML","config"], yml:["YAML","config"],
      toml:["TOML","config"], ini:["INI","config"], xml:["XML","markup"],
      html:["HTML","markup"], htm:["HTML","markup"], css:["CSS","css"],
      js:["JavaScript","javascript"], jsx:["JavaScript","javascript"],
      ts:["TypeScript","typescript"], tsx:["TypeScript","typescript"],
      py:["Python","python"], rs:["Rust","rust"], go:["Go","go"],
      c:["C","c"], h:["C/C++","cpp"], cpp:["C++","cpp"], hpp:["C++","cpp"],
      cs:["C#","csharp"], java:["Java","java"], sh:["Shell","shell"],
      ps1:["PowerShell","powershell"]
    })[ext] || ["Plain Text","text"];
  }

  function languageFor(name) { return languageInfo(name)[0]; }

  function escapeHtml(value) {
    return String(value).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  function tokenHtml(text, patterns) {
    let cursor = 0, output = "";
    while (cursor < text.length) {
      let best = null;
      for (const pattern of patterns) {
        pattern.regex.lastIndex = cursor;
        const match = pattern.regex.exec(text);
        if (!match) continue;
        if (!best || match.index < best.match.index ||
            (match.index === best.match.index && match[0].length > best.match[0].length)) {
          best = { pattern, match };
        }
      }
      if (!best) { output += escapeHtml(text.slice(cursor)); break; }
      if (best.match.index > cursor) output += escapeHtml(text.slice(cursor,best.match.index));
      output += '<span class="' + best.pattern.className + '">' + escapeHtml(best.match[0]) + '</span>';
      cursor = best.match.index + Math.max(1,best.match[0].length);
    }
    return output;
  }

  function syntaxPatterns(kind) {
    const commonStrings = { className:"syn-string", regex: /"(?:\\.|[^"\\])*"|\'(?:\\.|[^\'\\])*\'/g };
    const number = { className:"syn-number", regex: /\b(?:0x[\da-f]+|\d+(?:\.\d+)?)\b/gi };
    const keywordSets = {
      javascript:"break|case|catch|class|const|continue|default|delete|do|else|export|extends|finally|for|from|function|if|import|in|instanceof|let|new|of|return|static|super|switch|throw|try|typeof|var|while|yield|async|await",
      typescript:"abstract|as|any|boolean|break|case|catch|class|const|continue|declare|default|else|enum|export|extends|for|from|function|if|implements|import|in|interface|keyof|let|namespace|never|new|number|object|of|override|private|protected|public|readonly|return|static|string|switch|type|typeof|unknown|void|while|async|await",
      python:"and|as|assert|async|await|break|class|continue|def|del|elif|else|except|finally|for|from|global|if|import|in|is|lambda|nonlocal|not|or|pass|raise|return|try|while|with|yield",
      rust:"as|async|await|break|const|continue|crate|dyn|else|enum|extern|fn|for|if|impl|in|let|loop|match|mod|move|mut|pub|ref|return|self|Self|static|struct|super|trait|type|unsafe|use|where|while",
      go:"break|case|chan|const|continue|default|defer|else|fallthrough|for|func|go|goto|if|import|interface|map|package|range|return|select|struct|switch|type|var",
      c:"auto|break|case|char|const|continue|default|do|double|else|enum|extern|float|for|goto|if|inline|int|long|return|short|signed|sizeof|static|struct|switch|typedef|union|unsigned|void|volatile|while",
      cpp:"auto|bool|break|case|catch|char|class|const|constexpr|continue|default|delete|do|double|else|enum|explicit|extern|false|float|for|friend|if|inline|int|long|namespace|new|nullptr|operator|private|protected|public|return|short|signed|sizeof|static|struct|switch|template|this|throw|true|try|typedef|typename|union|unsigned|using|virtual|void|volatile|while",
      csharp:"abstract|as|async|await|base|bool|break|byte|case|catch|char|class|const|continue|decimal|default|delegate|do|double|else|enum|event|false|finally|float|for|foreach|if|in|int|interface|internal|is|long|namespace|new|null|object|out|override|private|protected|public|readonly|ref|return|short|static|string|struct|switch|this|throw|true|try|typeof|uint|ulong|using|virtual|void|while",
      java:"abstract|assert|boolean|break|byte|case|catch|char|class|continue|default|do|double|else|enum|extends|final|finally|float|for|if|implements|import|instanceof|int|interface|long|native|new|package|private|protected|public|return|short|static|super|switch|synchronized|this|throw|throws|try|void|volatile|while",
      powershell:"begin|break|catch|class|continue|do|else|elseif|end|enum|exit|filter|finally|for|foreach|function|if|in|param|process|return|switch|throw|trap|try|until|using|while",
      shell:"case|do|done|elif|else|esac|export|fi|for|function|if|in|local|readonly|return|select|then|until|while"
    };
    if (kind === "text") return [];
    if (kind === "json") return [
      { className:"syn-property", regex: /"(?:\\.|[^"\\])*"(?=\s*:)/g },
      commonStrings,
      { className:"syn-literal", regex: /\b(?:true|false|null)\b/g }, number
    ];
    if (kind === "python") return [
      { className:"syn-comment", regex: /#[^\n]*/g }, commonStrings, number,
      { className:"syn-keyword", regex: new RegExp("\\b(?:" + keywordSets.python + ")\\b","g") },
      { className:"syn-literal", regex: /\b(?:True|False|None)\b/g }
    ];
    if (kind === "powershell" || kind === "shell") return [
      { className:"syn-comment", regex: /#[^\n]*/g }, commonStrings, number,
      { className:"syn-keyword", regex: new RegExp("\\b(?:" + keywordSets[kind] + ")\\b","gi") }
    ];
    if (kind === "markdown") return [
      { className:"syn-heading", regex: /^#{1,6}[^\n]*/gm },
      { className:"syn-comment", regex: /<!--[\s\S]*?-->/g }
    ];
    if (kind === "markup") return [
      { className:"syn-comment", regex: /<!--[\s\S]*?-->/g },
      { className:"syn-tag", regex: /<\/?[A-Za-z][^>]*>/g }
    ];
    if (kind === "css") return [
      { className:"syn-comment", regex: /\/\*[\s\S]*?\*\//g }, commonStrings, number,
      { className:"syn-property", regex: /[-A-Za-z]+(?=\s*:)/g }
    ];
    if (kind === "config") return [
      { className:"syn-comment", regex: /#[^\n]*|;[^\n]*/g },
      { className:"syn-property", regex: /^[ \t]*[A-Za-z0-9_.-]+(?=\s*[:=])/gm },
      commonStrings, number, { className:"syn-literal", regex: /\b(?:true|false|null)\b/gi }
    ];
    const keywords = keywordSets[kind] || keywordSets.javascript;
    return [
      { className:"syn-comment", regex: /\/\*[\s\S]*?\*\/|\/\/[^\n]*/g },
      commonStrings, number,
      { className:"syn-keyword", regex: new RegExp("\\b(?:" + keywords + ")\\b","g") },
      { className:"syn-literal", regex: /\b(?:true|false|null|undefined)\b/g }
    ];
  }

  function updateSyntaxHighlight() {
    const tab = activeTab();
    if (!tab) { syntaxCode.textContent = ""; return; }
    const patterns = syntaxPatterns(languageInfo(tab.name)[1]);
    syntaxCode.innerHTML = patterns.length ? tokenHtml(tab.content,patterns) : escapeHtml(tab.content);
    syntaxLayer.scrollTop = editor.scrollTop;
    syntaxLayer.scrollLeft = editor.scrollLeft;
  }

  function detectEol(content) {
    return content.includes("\r\n") ? "CRLF" : "LF";
  }

  function activeTab() {
    return tabs.find(tab => tab.id === activeId) || null;
  }

  function makeId() {
    return "doc-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,8);
  }

  function newDocument(content = "") {
    const tab = {
      id: makeId(),
      name: "Untitled " + untitledCounter++,
      path: null,
      content,
      dirty: Boolean(content),
      recovered: false,
      encoding: "UTF-8",
      eol: detectEol(content),
      cursor: 0
    };
    tabs.push(tab);
    activeId = tab.id;
    render();
    schedulePersist();
    requestAnimationFrame(() => editor.focus());
  }

  function sessionPayload() {
    return {
      version: 1,
      activeId,
      untitledCounter,
      tabs: tabs.map(tab => ({
        id: tab.id,
        name: tab.name,
        path: tab.path,
        content: tab.content,
        dirty: Boolean(tab.dirty),
        encoding: tab.encoding || "UTF-8",
        eol: tab.eol || detectEol(tab.content),
        cursor: Number.isFinite(tab.cursor) ? tab.cursor : 0
      }))
    };
  }

  function persistNow() {
    clearTimeout(persistTimer);
    persistTimer = null;
    if (nativeDialogPending) return persistInFlight;
    const snapshot = sessionPayload();
    persistInFlight = persistInFlight
      .catch(() => {})
      .then(() => request("session.set", snapshot))
      .catch(error => console.warn("Editor recovery save failed:", error));
    return persistInFlight;
  }

  function schedulePersist(delay = 180) {
    clearTimeout(persistTimer);
    persistTimer = setTimeout(persistNow, delay);
  }

  async function restoreSession() {
    let stored = null;
    try {
      stored = await request("session.get");
    } catch (error) {
      console.warn("Editor could not restore its previous session:", error);
    }

    if (!stored || !Array.isArray(stored.tabs) || stored.tabs.length === 0) {
      newDocument();
      return;
    }

    untitledCounter = Math.max(1, Number(stored.untitledCounter) || 1);
    tabs = stored.tabs.map(raw => ({
      id: typeof raw.id === "string" ? raw.id : makeId(),
      name: typeof raw.name === "string" ? raw.name : "Untitled",
      path: typeof raw.path === "string" && raw.path ? raw.path : null,
      content: typeof raw.content === "string" ? raw.content : "",
      dirty: Boolean(raw.dirty),
      recovered: Boolean(raw.path && raw.dirty),
      encoding: "UTF-8",
      eol: raw.eol === "CRLF" ? "CRLF" : detectEol(String(raw.content || "")),
      cursor: Math.max(0, Number(raw.cursor) || 0)
    }));

    for (const tab of tabs) {
      if (!tab.path || tab.dirty) continue;
      try {
        const fresh = await request("file.read", { path: tab.path });
        tab.content = fresh.content;
        tab.name = fresh.name || basename(tab.path);
        tab.eol = fresh.eol || detectEol(tab.content);
      } catch (error) {
        console.warn("Editor could not refresh remembered file:", tab.path, error);
      }
    }

    activeId = tabs.some(tab => tab.id === stored.activeId) ? stored.activeId : tabs[0].id;
    render();
    schedulePersist(400);
  }

  function updateGutter() {
    const tab = activeTab();
    const count = tab ? Math.max(1, tab.content.split("\n").length) : 1;
    let lines = "";
    for (let i = 1; i <= count; i++) lines += i + (i === count ? "" : "\n");
    gutter.textContent = lines;
    gutter.scrollTop = editor.scrollTop;
  }

  function updatePosition() {
    const tab = activeTab();
    if (!tab) {
      position.textContent = "Ln 1, Col 1";
      return;
    }
    const caret = editor.selectionStart;
    tab.cursor = caret;
    const before = tab.content.slice(0, caret);
    const line = before.split("\n").length;
    const lastNewline = before.lastIndexOf("\n");
    const col = caret - lastNewline;
    position.textContent = `Ln ${line}, Col ${col}`;
  }

  function clearTabDropIndicators() {
    for (const element of tabsHost.querySelectorAll(".tab")) {
      element.classList.remove("drop-before", "drop-after", "dragging");
    }
  }

  function reorderTab(draggedId, targetId, placeAfter) {
    const fromIndex = tabs.findIndex(tab => tab.id === draggedId);
    const targetIndex = tabs.findIndex(tab => tab.id === targetId);
    if (fromIndex < 0 || targetIndex < 0 || fromIndex === targetIndex) return false;

    const [moved] = tabs.splice(fromIndex, 1);
    let insertIndex = tabs.findIndex(tab => tab.id === targetId);
    if (insertIndex < 0) {
      tabs.push(moved);
      return true;
    }
    if (placeAfter) insertIndex += 1;
    tabs.splice(insertIndex, 0, moved);
    return true;
  }

  function updateTabScrollButtons() {
    const max = Math.max(0, tabsHost.scrollWidth - tabsHost.clientWidth);
    tabsPrev.disabled = tabsHost.scrollLeft <= 1;
    tabsNext.disabled = tabsHost.scrollLeft >= max - 1;
  }

  function ensureActiveTabVisible() {
    const active = tabsHost.querySelector('.tab[data-tab-id="' + CSS.escape(String(activeId || "")) + '"]');
    if (active) active.scrollIntoView({ block:"nearest", inline:"nearest" });
    requestAnimationFrame(updateTabScrollButtons);
  }

  function renderTabs() {
    tabsHost.replaceChildren();
    for (const tab of tabs) {
      const item = document.createElement("div");
      item.className = "tab" + (tab.id === activeId ? " active" : "");
      item.title = tab.path || tab.name;
      item.draggable = true;
      item.dataset.tabId = tab.id;

      item.addEventListener("click", event => {
        if (event.target.closest(".tab-close")) return;
        if (activeId === tab.id) {
          editor.focus();
          return;
        }
        activeId = tab.id;
        render();
        requestAnimationFrame(() => editor.focus());
        schedulePersist();
      });

      item.addEventListener("dragstart", event => {
        if (event.target.closest(".tab-close")) {
          event.preventDefault();
          return;
        }
        draggedTabId = tab.id;
        item.classList.add("dragging");
        if (event.dataTransfer) {
          event.dataTransfer.effectAllowed = "move";
          event.dataTransfer.setData("text/plain", tab.id);
        }
      });

      item.addEventListener("dragover", event => {
        if (!draggedTabId || draggedTabId === tab.id) return;
        event.preventDefault();
        if (event.dataTransfer) event.dataTransfer.dropEffect = "move";
        const bounds = item.getBoundingClientRect();
        const placeAfter = event.clientX >= bounds.left + bounds.width / 2;
        item.classList.toggle("drop-before", !placeAfter);
        item.classList.toggle("drop-after", placeAfter);
      });

      item.addEventListener("dragleave", () => {
        item.classList.remove("drop-before", "drop-after");
      });

      item.addEventListener("drop", event => {
        if (!draggedTabId || draggedTabId === tab.id) return;
        event.preventDefault();
        const bounds = item.getBoundingClientRect();
        const placeAfter = event.clientX >= bounds.left + bounds.width / 2;
        const changed = reorderTab(draggedTabId, tab.id, placeAfter);
        draggedTabId = null;
        clearTabDropIndicators();
        if (changed) {
          renderTabs();
          persistNow();
        }
      });

      item.addEventListener("dragend", () => {
        draggedTabId = null;
        clearTabDropIndicators();
      });

      const name = document.createElement("span");
      name.className = "tab-name";
      name.textContent = tab.name;
      item.appendChild(name);

      if (tab.dirty) {
        const dot = document.createElement("span");
        dot.className = "dirty";
        dot.textContent = "•";
        dot.title = tab.recovered ? "Recovered edits not saved to disk" : "Not saved to disk";
        item.appendChild(dot);
      }

      if (tab.recovered) {
        const recovered = document.createElement("span");
        recovered.textContent = "Recovered";
        recovered.style.fontSize = "10px";
        item.appendChild(recovered);
      }

      const close = document.createElement("button");
      close.className = "tab-close";
      close.type = "button";
      close.textContent = "×";
      close.title = "Close";
      close.addEventListener("mousedown", event => {
        event.stopPropagation();
        event.preventDefault();
      });
      close.addEventListener("click", event => {
        event.stopPropagation();
        closeTab(tab.id);
      });
      item.appendChild(close);
      tabsHost.appendChild(item);
    }
    requestAnimationFrame(ensureActiveTabVisible);
  }

  tabsPrev.addEventListener("click", () => {
    tabsHost.scrollBy({ left: -Math.max(140, Math.round(tabsHost.clientWidth * .55)), behavior:"smooth" });
  });
  tabsNext.addEventListener("click", () => {
    tabsHost.scrollBy({ left: Math.max(140, Math.round(tabsHost.clientWidth * .55)), behavior:"smooth" });
  });
  tabsHost.addEventListener("scroll", updateTabScrollButtons, { passive:true });
  window.addEventListener("resize", updateTabScrollButtons);

  tabsHost.addEventListener("dragover", event => {
    if (!draggedTabId || event.target.closest(".tab")) return;
    event.preventDefault();
    if (event.dataTransfer) event.dataTransfer.dropEffect = "move";
  });

  tabsHost.addEventListener("drop", event => {
    if (!draggedTabId || event.target.closest(".tab")) return;
    event.preventDefault();
    const fromIndex = tabs.findIndex(tab => tab.id === draggedTabId);
    if (fromIndex >= 0 && fromIndex !== tabs.length - 1) {
      const [moved] = tabs.splice(fromIndex, 1);
      tabs.push(moved);
      renderTabs();
      persistNow();
    }
    draggedTabId = null;
    clearTabDropIndicators();
  });

  function render() {
    const tab = activeTab();
    renderTabs();

    const hasTab = Boolean(tab);
    editorWrap.hidden = !hasTab;
    empty.hidden = hasTab;
    editor.disabled = !hasTab;

    if (!tab) {
      recovery.hidden = true;
      saveState.textContent = "";
      return;
    }

    if (editor.value !== tab.content) editor.value = tab.content;
    updateSyntaxHighlight();
    const cursor = Math.min(tab.cursor || 0, tab.content.length);
    editor.setSelectionRange(cursor, cursor);

    recovery.hidden = !tab.recovered;
    encoding.textContent = tab.encoding || "UTF-8";
    eol.textContent = tab.eol || detectEol(tab.content);
    language.textContent = languageFor(tab.name);
    saveState.textContent = tab.dirty
      ? (tab.recovered ? "Recovered • Not saved to disk" : "Modified • Not saved to disk")
      : "Saved";
    saveState.className = tab.dirty ? "status-dirty" : "";

    updateGutter();
    updatePosition();
  }

  async function openFile() {
    if (nativeDialogPending) return;
    nativeDialogPending = true;
    try {
      const result = await request("file.open");
      if (!result || result.opened === false || !result.path) return;
      const existing = tabs.find(tab => tab.path === result.path);
      if (existing) {
        activeId = existing.id;
        render();
        return;
      }
      const tab = {
        id: makeId(),
        name: result.name || basename(result.path),
        path: result.path,
        content: result.content || "",
        dirty: false,
        recovered: false,
        encoding: result.encoding || "UTF-8",
        eol: result.eol || detectEol(result.content || ""),
        cursor: 0
      };
      tabs.push(tab);
      activeId = tab.id;
      render();
      requestAnimationFrame(() => editor.focus());
    } catch (error) {
      await messageModal("Could not open file", String(error));
    } finally {
      nativeDialogPending = false;
      await persistNow();
    }
  }

  async function saveTab(tab = activeTab()) {
    if (!tab) return false;
    if (!tab.path) return saveAsTab(tab);
    try {
      const result = await request("file.write", { path: tab.path, content: tab.content });
      tab.name = result.name || basename(tab.path);
      tab.dirty = false;
      tab.recovered = false;
      tab.eol = result.eol || detectEol(tab.content);
      render();
      await persistNow();
      return true;
    } catch (error) {
      await messageModal("Could not save file", String(error));
      return false;
    }
  }

  async function saveAsTab(tab = activeTab()) {
    if (!tab || nativeDialogPending) return false;
    nativeDialogPending = true;
    try {
      const suggested = tab.path ? tab.name : (tab.name.startsWith("Untitled ") ? "untitled.txt" : tab.name);
      const result = await request("file.save_as", { suggestedName: suggested, content: tab.content });
      if (!result || !result.saved) return false;
      tab.path = result.path;
      tab.name = basename(result.path);
      tab.dirty = false;
      tab.recovered = false;
      tab.eol = detectEol(tab.content);
      render();
      return true;
    } catch (error) {
      await messageModal("Could not save file", String(error));
      return false;
    } finally {
      nativeDialogPending = false;
      await persistNow();
    }
  }

  async function discardRecovered(tab) {
    if (!tab || !tab.path) return;
    try {
      const fresh = await request("file.read", { path: tab.path });
      tab.content = fresh.content || "";
      tab.name = fresh.name || basename(tab.path);
      tab.dirty = false;
      tab.recovered = false;
      tab.eol = fresh.eol || detectEol(tab.content);
      tab.cursor = 0;
      render();
      await persistNow();
      editor.focus();
    } catch (error) {
      await messageModal("Could not reload file", String(error));
    }
  }

  function switchTab(direction) {
    if (tabs.length < 2) return;
    const current = tabs.findIndex(tab => tab.id === activeId);
    const start = current >= 0 ? current : 0;
    const next = (start + direction + tabs.length) % tabs.length;
    activeId = tabs[next].id;
    render();
    schedulePersist();
    requestAnimationFrame(() => editor.focus());
  }

  async function closeTab(id) {
    const tab = tabs.find(item => item.id === id);
    if (!tab) return;

    if (!tab.path) {
      const choice = await choiceModal(
        "Close unsaved document?",
        `“${tab.name}” has never been saved as a file.`,
        [
          { id:"save", label:"Save As", primary:true },
          { id:"discard", label:"Discard", danger:true },
          { id:"cancel", label:"Cancel" }
        ]
      );
      if (choice === "cancel" || choice === null) return;
      if (choice === "save" && !(await saveAsTab(tab))) return;
    } else if (tab.dirty) {
      const choice = await choiceModal(
        "Close modified file?",
        `“${tab.name}” contains changes that have not been written to disk.`,
        [
          { id:"save", label:"Save", primary:true },
          { id:"discard", label:"Discard", danger:true },
          { id:"cancel", label:"Cancel" }
        ]
      );
      if (choice === "cancel" || choice === null) return;
      if (choice === "save" && !(await saveTab(tab))) return;
    }

    const index = tabs.findIndex(item => item.id === id);
    tabs.splice(index, 1);
    if (activeId === id) {
      activeId = tabs[Math.min(index, tabs.length - 1)]?.id || null;
    }
    render();
    await persistNow();
    if (tabs.length === 0) newDocument();
  }

  function findMatches(query) {
    const tab = activeTab();
    if (!tab || !query) return [];
    const haystack = tab.content.toLocaleLowerCase();
    const needle = query.toLocaleLowerCase();
    const matches = [];
    let index = 0;
    while ((index = haystack.indexOf(needle, index)) >= 0) {
      matches.push(index);
      index += Math.max(1, needle.length);
    }
    return matches;
  }

  function updateFindCount(query = findInput.value) {
    const matches = findMatches(query);
    if (!query || matches.length === 0) {
      findCount.textContent = "0 of 0";
      return matches;
    }
    const selectionStart = editor.selectionStart;
    let current = matches.findIndex(index => index === selectionStart);
    if (current < 0) current = 0;
    findCount.textContent = (current + 1) + " of " + matches.length;
    return matches;
  }

  function closeFind(focusEditor = true) {
    findbar.hidden = true;
    if (focusEditor) editor.focus();
  }

  function openFind() {
    findbar.hidden = false;
    const selected = editor.value.slice(editor.selectionStart, editor.selectionEnd);
    if (selected) findInput.value = selected;
    updateFindCount();
    findInput.focus();
    findInput.select();
  }

  function findMove(direction) {
    const query = findInput.value;
    const tab = activeTab();
    if (!tab || !query) {
      updateFindCount(query);
      return;
    }
    const matches = findMatches(query);
    if (matches.length === 0) {
      findCount.textContent = "0 of 0";
      return;
    }

    let target;
    if (direction > 0) {
      target = matches.find(index => index >= editor.selectionEnd);
      if (target === undefined) target = matches[0];
    } else {
      for (let i = matches.length - 1; i >= 0; i--) {
        if (matches[i] < editor.selectionStart) {
          target = matches[i];
          break;
        }
      }
      if (target === undefined) target = matches[matches.length - 1];
    }

    editor.focus({ preventScroll:true });
    editor.setSelectionRange(target, target + query.length);
    const current = matches.indexOf(target);
    findCount.textContent = (current + 1) + " of " + matches.length;
    updatePosition();
    findInput.focus({ preventScroll:true });
  }

  function findNext() { findMove(1); }
  function findPrevious() { findMove(-1); }

  function closeModal(value = null) {
    modalBackdrop.hidden = true;
    modalActions.replaceChildren();
    const resolve = modalResolve;
    modalResolve = null;
    if (resolve) resolve(value);
  }

  function choiceModal(title, message, choices) {
    if (modalResolve) closeModal(null);
    modalTitle.textContent = title;
    modalMessage.textContent = message;
    modalActions.replaceChildren();
    modalBackdrop.hidden = false;

    return new Promise(resolve => {
      modalResolve = resolve;
      for (const choice of choices) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = choice.label;
        if (choice.primary) button.classList.add("primary");
        if (choice.danger) button.classList.add("danger");
        button.addEventListener("click", () => closeModal(choice.id));
        modalActions.appendChild(button);
      }
    });
  }

  async function messageModal(title, message) {
    await choiceModal(title, message, [{ id:"ok", label:"Close", primary:true }]);
  }

  document.getElementById("newBtn").addEventListener("click", () => newDocument());
  document.getElementById("openBtn").addEventListener("click", openFile);
  document.getElementById("saveBtn").addEventListener("click", () => saveTab());
  document.getElementById("saveAsBtn").addEventListener("click", () => saveAsTab());
  document.getElementById("findBtn").addEventListener("click", openFind);
  document.getElementById("findPrev").addEventListener("click", findPrevious);
  document.getElementById("findNext").addEventListener("click", findNext);
  document.getElementById("findClose").addEventListener("click", () => closeFind(true));
  document.getElementById("recoverySave").addEventListener("click", () => saveTab());
  document.getElementById("recoveryDiscard").addEventListener("click", () => discardRecovered(activeTab()));

  findInput.addEventListener("input", () => updateFindCount());
  findInput.addEventListener("keydown", event => {
    if (event.key === "Enter") {
      event.preventDefault();
      if (event.shiftKey) findPrevious();
      else findNext();
    } else if (event.key === "Escape") {
      event.preventDefault();
      closeFind(true);
    }
  });

  document.addEventListener("mousedown", event => {
    if (findbar.hidden) return;
    const target = event.target;
    if (findbar.contains(target) || document.getElementById("findBtn").contains(target)) return;
    closeFind(false);
  });

  modalBackdrop.addEventListener("mousedown", event => {
    if (event.target === modalBackdrop) closeModal(null);
  });

  editor.addEventListener("keydown", event => {
    const tab = activeTab();
    if (!tab) return;

    if (event.key === "Tab" && !event.ctrlKey && !event.altKey && !event.metaKey) {
      event.preventDefault();
      const start = editor.selectionStart;
      const end = editor.selectionEnd;
      const value = editor.value;
      const indent = "    ";

      if (start !== end && value.slice(start, end).includes("\n")) {
        const lineStart = value.lastIndexOf("\n", start - 1) + 1;
        const selectedEnd = end > start && value[end - 1] === "\n" ? end - 1 : end;
        const lineEndPos = value.indexOf("\n", selectedEnd);
        const lineEnd = lineEndPos >= 0 ? lineEndPos : value.length;
        const block = value.slice(lineStart, lineEnd);

        if (event.shiftKey) {
          let removedBeforeStart = 0;
          let removedTotal = 0;
          let offset = 0;
          const lines = block.split("\n");
          const updated = lines.map((line, index) => {
            const match = line.match(/^( {1,4}|\t)/);
            const remove = match ? match[0].length : 0;
            if (index === 0) removedBeforeStart = Math.min(remove, start - lineStart);
            removedTotal += remove;
            offset += line.length + 1;
            return line.slice(remove);
          }).join("\n");
          editor.setRangeText(updated, lineStart, lineEnd, "preserve");
          editor.setSelectionRange(
            Math.max(lineStart, start - removedBeforeStart),
            Math.max(lineStart, end - removedTotal)
          );
        } else {
          const updated = block.split("\n").map(line => indent + line).join("\n");
          editor.setRangeText(updated, lineStart, lineEnd, "preserve");
          const lineCount = block.split("\n").length;
          editor.setSelectionRange(start + indent.length, end + indent.length * lineCount);
        }
      } else if (event.shiftKey) {
        const lineStart = value.lastIndexOf("\n", start - 1) + 1;
        const match = value.slice(lineStart).match(/^( {1,4}|\t)/);
        if (match) {
          const remove = match[0].length;
          editor.setRangeText("", lineStart, lineStart + remove, "preserve");
          editor.setSelectionRange(Math.max(lineStart, start - remove), Math.max(lineStart, end - remove));
        }
      } else {
        editor.setRangeText(indent, start, end, "end");
      }
      editor.dispatchEvent(new Event("input", { bubbles:true }));
      return;
    }

    if (event.key === "Enter" && !event.ctrlKey && !event.altKey && !event.metaKey) {
      event.preventDefault();
      const start = editor.selectionStart;
      const end = editor.selectionEnd;
      const lineStart = editor.value.lastIndexOf("\n", start - 1) + 1;
      const beforeCaret = editor.value.slice(lineStart, start);
      const leading = (beforeCaret.match(/^[ \t]*/) || [""])[0];
      editor.setRangeText("\n" + leading, start, end, "end");
      editor.dispatchEvent(new Event("input", { bubbles:true }));
    }
  });

  editor.addEventListener("input", () => {
    const tab = activeTab();
    if (!tab) return;
    tab.content = editor.value;
    tab.dirty = true;
    tab.eol = detectEol(tab.content);
    updateSyntaxHighlight();
    updateGutter();
    updatePosition();
    renderTabs();
    eol.textContent = tab.eol;
    saveState.textContent = tab.recovered ? "Recovered • Not saved to disk" : "Modified • Not saved to disk";
    saveState.className = "status-dirty";
    schedulePersist();
  });

  editor.addEventListener("scroll", () => {
    gutter.scrollTop = editor.scrollTop;
    syntaxLayer.scrollTop = editor.scrollTop;
    syntaxLayer.scrollLeft = editor.scrollLeft;
  });
  editor.addEventListener("click", updatePosition);
  editor.addEventListener("keyup", updatePosition);
  editor.addEventListener("select", updatePosition);

  window.addEventListener("keydown", event => {
    const key = event.key.toLowerCase();
    if (event.ctrlKey && key === "tab") {
      event.preventDefault();
      switchTab(event.shiftKey ? -1 : 1);
    } else if (event.ctrlKey && !event.shiftKey && key === "w") {
      event.preventDefault();
      closeTab(activeId);
    } else if (event.ctrlKey && !event.shiftKey && key === "n") {
      event.preventDefault();
      newDocument();
    } else if (event.ctrlKey && !event.shiftKey && key === "o") {
      event.preventDefault();
      openFile();
    } else if (event.ctrlKey && !event.shiftKey && key === "s") {
      event.preventDefault();
      saveTab();
    } else if (event.ctrlKey && event.shiftKey && key === "s") {
      event.preventDefault();
      saveAsTab();
    } else if (event.ctrlKey && !event.shiftKey && key === "f") {
      event.preventDefault();
      openFind();
    } else if (event.key === "Escape" && !findbar.hidden) {
      event.preventDefault();
      closeFind(true);
    }
  });

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") persistNow();
  });
  window.addEventListener("blur", () => persistNow());
  window.addEventListener("pagehide", () => persistNow());

  restoreSession();
})();
</script>
</body>
</html>
