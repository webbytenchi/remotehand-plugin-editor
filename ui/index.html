<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor</title>
<link rel="stylesheet" href="./editor.css">
</head>
<body>
<div class="shell">
  <div class="toolbar">
    <button id="newBtn" class="tool" type="button" title="New (Ctrl+N)">New</button>
    <button id="openBtn" class="tool" type="button" title="Open (Ctrl+O)">Open</button>
    <button id="saveBtn" class="tool" type="button" title="Save (Ctrl+S)">Save</button>
    <button id="saveAsBtn" class="tool" type="button" title="Save As (Ctrl+Shift+S)">Save As</button>
    <button id="fileAssociationsBtn" class="tool icon-tool" type="button" title="File associations" aria-label="File associations">⚙</button>
    <span class="spacer"></span>
    <label id="hexEditControl" class="toolbar-toggle" title="Allow controlled hexadecimal byte editing" hidden>
      <input id="hexEdit" type="checkbox">
      <span>Hex editor</span>
    </label>
    <label id="csvViewControl" class="toolbar-toggle" title="Edit this CSV file as a table" hidden>
      <input id="csvView" type="checkbox">
      <span>CSV view</span>
    </label>
    <label id="mdPreviewControl" class="toolbar-toggle" title="Render this Markdown file as a preview" hidden>
      <input id="mdPreview" type="checkbox">
      <span>MD preview</span>
    </label>
    <label class="toolbar-toggle" title="Wrap long lines to the editor width">
      <input id="wrapText" type="checkbox">
      <span>Wrap text</span>
    </label>
    <label class="toolbar-toggle" title="Show or hide editor line numbers">
      <input id="lineNumbers" type="checkbox" checked>
      <span>Line numbers</span>
    </label>
    <label id="autocompleteControl" class="toolbar-toggle" title="Show code completion suggestions" hidden>
      <input id="autocomplete" type="checkbox" checked>
      <span>Autocomplete</span>
    </label>
    <button id="findBtn" class="tool" type="button" title="Find (Ctrl+F)">Find</button>
  </div>

  <div id="tabsShell" class="tabs-shell">
    <button id="tabsPrev" class="tab-scroll" type="button" title="Scroll tabs left" aria-label="Scroll tabs left">‹</button>
    <div id="tabs" class="tabs"></div>
    <button id="tabsNext" class="tab-scroll" type="button" title="Scroll tabs right" aria-label="Scroll tabs right">›</button>
  </div>

  <div class="workspace">
    <div id="editorHost" class="editor-host"></div>
    <div id="csvHost" class="csv-host" hidden>
      <div id="csvTableWrap" class="csv-table-wrap"></div>
    </div>
    <div id="mdPreviewHost" class="md-preview-host" hidden>
      <article id="mdPreviewContent" class="md-preview-content"></article>
    </div>
    <div id="empty" class="empty" hidden>No document is open.</div>

    <div id="findbar" class="findbar" hidden>
      <div class="find-row">
        <input id="findInput" type="text" autocomplete="off" placeholder="Find text">
        <label class="replace-toggle" title="Show replace controls">
          <input id="replaceToggle" type="checkbox">
          <span>Replace</span>
        </label>
        <span id="findCount" class="find-count">0 of 0</span>
        <button id="findPrev" type="button" title="Previous (Shift+Enter)">Previous</button>
        <button id="findNext" type="button" title="Next (Enter)">Next</button>
        <button id="findClose" type="button" aria-label="Close find">×</button>
      </div>
      <div id="replaceRow" class="replace-row" hidden>
        <input id="replaceInput" type="text" autocomplete="off" placeholder="Replace with">
        <button id="replaceOne" type="button" title="Replace current (Ctrl+Enter)">Replace</button>
        <button id="replaceAll" type="button" title="Replace All (Ctrl+Alt+Enter)">Replace All</button>
      </div>
    </div>
  </div>

  <div class="statusbar">
    <span id="position">Ln 1, Col 1</span>
    <span class="spacer"></span>
    <span id="saveState"></span>
    <span id="encoding">UTF-8</span>
    <span id="eol">LF</span>
    <span id="language">Plain Text</span>
  </div>
</div>

<div id="modalBackdrop" class="modal-backdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <h2 id="modalTitle"></h2>
    <p id="modalMessage"></p>
    <div id="fileAssocSettings" class="file-assoc-settings" hidden>
      <div class="file-assoc-toolbar">
        <span>File extensions</span>
        <div>
          <button id="fileAssocSelectAll" type="button">Select all</button>
          <button id="fileAssocDeselectAll" type="button">Deselect all</button>
        </div>
      </div>
      <div class="file-assoc-options">
        <label><input type="checkbox" data-extension="txt"><span><strong>.txt</strong> Plain text files</span></label>
        <label><input type="checkbox" data-extension="log"><span><strong>.log</strong> Log files</span></label>
        <label><input type="checkbox" data-extension="md"><span><strong>.md</strong> Markdown files</span></label>
        <label><input type="checkbox" data-extension="json"><span><strong>.json</strong> JSON files</span></label>
        <label><input type="checkbox" data-extension="csv"><span><strong>.csv</strong> CSV files</span></label>
      </div>
      <label class="file-assoc-custom-label" for="fileAssocCustom">Custom extensions</label>
      <input id="fileAssocCustom" class="file-assoc-custom" type="text" placeholder="yaml, yml, xml, ini" autocomplete="off">
      <p id="fileAssocError" class="file-assoc-error" hidden></p>
      <p class="file-assoc-help">Separate extensions with commas. A leading dot is optional. Windows may still ask you to choose RemoteHand as the default app.</p>
    </div>
    <div id="modalActions" class="modal-actions"></div>
  </div>
</div>

<script src="./editor.js"></script>
</body>
</html>
